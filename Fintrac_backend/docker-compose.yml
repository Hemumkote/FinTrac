version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fintrac_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daily_tracker
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintrac_network

  redis:
    image: redis:7-alpine
    container_name: fintrac_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintrac_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrac_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    working_dir: /app
    stdin_open: true
    tty: true
    networks:
      - fintrac_network

volumes:
  postgres_data:
  redis_data:

networks:
  fintrac_network:
    driver: bridge
